name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check core/ || true

      - name: Test with coverage
        run: pytest --cov=core --cov-report=term-missing --cov-report=json:coverage-python.json

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: coverage-python.json

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Lint
        working-directory: ui
        run: npm run lint

      - name: Type check
        working-directory: ui
        run: npx tsc -b --noEmit

      - name: Unit tests with coverage
        working-directory: ui
        run: npm run test:unit:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: ui/coverage/coverage-summary.json

  coverage-comment:
    runs-on: ubuntu-latest
    needs: [test-python, test-frontend]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Download Python coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-python
          path: coverage
        continue-on-error: true

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-frontend
          path: coverage
        continue-on-error: true

      - name: Generate coverage comment
        id: comment
        run: |
          BODY="## 📊 Coverage Report\n\n"

          if [ -f coverage/coverage-python.json ]; then
            PY_PCT=$(python3 -c "
          import json
          with open('coverage/coverage-python.json') as f:
              d = json.load(f)
          total = d.get('totals', {})
          print(f\"{total.get('percent_covered_display', '0')}%\")
          ")
            PY_STMTS=$(python3 -c "
          import json
          with open('coverage/coverage-python.json') as f:
              d = json.load(f)
          total = d.get('totals', {})
          print(f\"{total.get('covered_lines', 0)}/{total.get('num_statements', 0)}\")
          ")
            BODY+="| Component | Coverage | Lines |\n"
            BODY+="|-----------|----------|-------|\n"
            BODY+="| 🐍 Python (core/) | **${PY_PCT}** | ${PY_STMTS} |\n"
          else
            BODY+="| Component | Coverage | Lines |\n"
            BODY+="|-----------|----------|-------|\n"
            BODY+="| 🐍 Python (core/) | ⚠️ no data | - |\n"
          fi

          if [ -f coverage/coverage-summary.json ]; then
            FE_PCT=$(python3 -c "
          import json
          with open('coverage/coverage-summary.json') as f:
              d = json.load(f)
          total = d.get('total', {})
          lines = total.get('lines', {})
          print(f\"{lines.get('pct', 0)}%\")
          ")
            FE_LINES=$(python3 -c "
          import json
          with open('coverage/coverage-summary.json') as f:
              d = json.load(f)
          total = d.get('total', {})
          lines = total.get('lines', {})
          print(f\"{lines.get('covered', 0)}/{lines.get('total', 0)}\")
          ")
            BODY+="| ⚛️ Frontend (ui/) | **${FE_PCT}** | ${FE_LINES} |\n"
          else
            BODY+="| ⚛️ Frontend (ui/) | ⚠️ no data | - |\n"
          fi

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> "$GITHUB_OUTPUT"
          echo -e "$BODY" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '📊 Coverage Report'

      - name: Post or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.comment.outputs.body }}
          edit-mode: replace
